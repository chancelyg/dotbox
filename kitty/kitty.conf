# ==============================================================================
# 基础环境变量与主题
# ==============================================================================
# env TERM=xterm
include ./theme.conf

# BEGIN_KITTY_THEME
# GitHub Dark
include current-theme.conf
# END_KITTY_THEME


# ==============================================================================
# 字体设置 (Fonts)
# ==============================================================================
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        16.0

# 针对 macOS 视网膜屏幕（Retina）微调字体粗细，防止高分屏下显得过细
macos_thicken_font 0.5


# ==============================================================================
# 窗口与基础布局 (Window Layout & Performance)
# ==============================================================================
scrollback_lines          4096
remember_window_size      yes
initial_window_width      960
initial_window_height     540

# 多分屏时，设置未聚焦窗口的文本变暗程度（0.0 到 1.0），方便眼睛快速定位当前光标
inactive_text_alpha       0.8

# 设置鼠标拖拽边框的灵敏度。设置为大于 0 即可直接用鼠标拖拽调整分屏边界大小
window_drag_tolerance     1.0

# 当最后一个 kitty 窗口被关闭时，完全退出应用程序（符合大多数 Mac 用户的习惯）
macos_quit_when_last_window_closed yes

# 隐藏窗口标题栏，跟随操作系统的深浅色主题自动变色
macos_titlebar_color      system


# ==============================================================================
# 标签页控制栏 (Tab Bar)
# ==============================================================================
tab_bar_edge              bottom
tab_bar_style             separator
tab_separator             "  |  "
tab_title_max_length      18

# 垫高一点点标签栏的上下边距，配合 separator 极简风格视觉上更松弛现代
tab_bar_margin_width      2.0
tab_bar_margin_height     3.0 0.0


# ==============================================================================
# 鼠标与滚动控制 (Mouse & Scrolling)
# ==============================================================================
# 启用像素级平滑滚动，在 Mac 妙控鼠标或触控板上体验极佳
pixel_scroll              yes

# 按下 Cmd + 鼠标左键点击时，直接在 Mac 默认浏览器中打开终端里的链接
# 提示：不直接绑定“纯左键点击”，是为了防止和正常的鼠标拖选/复制文本功能冲突
mouse_map cmd+left click ungrabbed mouse_handle_click selection link


# ==============================================================================
# 0.41+ 新版本特性配置 (Advanced & New Features)
# ==============================================================================
# 自动重载配置：检测到 kitty.conf 被修改时延迟 0.1 秒触发防抖自动刷新
auto_reload_config        0.1

# 光标拖尾动画：单位为毫秒(ms)。只有光标在某处停顿超过 100ms 后的跳跃大移动才会带拖尾
# 能够有效防止在内容剧烈刷新（如 cat 大文件）时满屏都是动画造成的视觉疲劳
# cursor_trail              100


# ==============================================================================
# 快捷键映射 (Keyboard Shortcuts)
# ==============================================================================
# 允许左侧 Option 键作为 Alt 键使用（解决原生 Mac 下各种 CLI 工具 Alt 快捷键失效的问题）
macos_option_as_alt       left

# 标签页切换
map shift+left            previous_tab
map shift+right           next_tab

# macOS 风格的一键全选
map cmd+a                 select_all

# 将 Cmd + 左右方向键映射为 Home/End，符合 Mac 系统的文本光标跳转习惯
map cmd+left              send_key home
map cmd+right             send_key end

# 功能面板与辅助 kitten
map cmd+f                 show_scrollback
map cmd+p                 kitten hints
map cmd+shift+p           toggle_command_palette

# 窗口管理：使用 Cmd + Enter 快速切分出新窗口（分屏）
map cmd+enter             new_window